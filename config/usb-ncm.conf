# Settings for usb-ncm.service, read by /usr/local/sbin/usb-ncm.sh.
#
# Adds an NCM network function next to the ACM console the initramfs creates, so
# the USB cable carries both a terminal and an ethernet-like link.

ENABLED=1

# Address for the phone end. The host picks something on the same subnet.
ADDRESS=192.168.42.1
PREFIX=24