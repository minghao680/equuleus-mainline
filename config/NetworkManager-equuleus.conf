[main]
plugins=keyfile

[device]
wifi.backend=wpa_supplicant
wifi.scan-rand-mac-address=no

[connection]
# Saved profiles opt in to autoconnect in NetworkManager. Keep retrying when
# a saved network is briefly unavailable. NetworkManager handles DHCP itself.
connection.autoconnect-retries=0
wifi.cloned-mac-address=preserve
