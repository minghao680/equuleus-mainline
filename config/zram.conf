# Tuning for zram-swap.service, read by /usr/local/sbin/zram-swap.sh.

# Size of the compressed block device, as a percentage of MemTotal. 50% of
# 8 GB gives a 3.7 GB swap area that typically holds far more than that in
# practice, because zstd compresses the pages.
SIZE_PERCENT=50

# Higher than any disk swap so zram is used first.
PRIORITY=100

# zstd is the kernel default here and the best ratio of the built-in options.
ALGORITHM=zstd

# zram pages are cheap, so let the kernel swap more eagerly than the stock 60.
SWAPPINESS=150