# Settings for the optional Wi-Fi hotspot, read by /usr/local/sbin/hotspot.
#
# The hotspot is NOT started at boot. Enable it by hand when needed:
#
#   hotspot start wifi      # share the Wi-Fi uplink
#   hotspot start mobile    # share the modem's IPv4 data
#   hotspot status
#   hotspot stop
#
# Note: the AP shares the radio with the Wi-Fi client connection and must use its
# channel, so throughput is roughly halved while the hotspot runs.
SSID=Equuleus-AP
PSK=equuleus1234