# Settings for cpu-boost.service, read by /usr/local/sbin/cpu-boost.sh.
#
# BOOST=1 asks the kernel to expose the big cluster's boost OPP. On this SoC that
# is 2.8032 GHz, which stock firmware also uses; the voltage comes from the
# hardware LUT, so this is a fused operating point rather than an overclock.
BOOST=1

# The governor that actually reaches the boost OPP. schedutil cannot: it derives
# its next request from the current frequency, so it never exceeds 2.6496 GHz.
GOVERNOR=performance

# "all" pins both clusters at their maximum frequency. "big" leaves the four
# little cores on schedutil to save idle power.
POLICIES=all