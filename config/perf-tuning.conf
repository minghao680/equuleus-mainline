# Tuning for perf-tuning.service, read by /usr/local/sbin/perf-tuning.sh.
#
# Both settings were measured on an equuleus; see docs/STATUS.md.

# Disable cpu-sleep (~885 us exit latency) on the four gold cores. Measured
# effect: ping average RTT 1.94/1.90/2.26 ms -> 1.19/1.16/1.17 ms, and jitter
# (mdev) 1.01/1.13/2.22 ms -> 0.58/0.10/0.12 ms. The silver cores keep theirs.
BIG_IDLE_DISABLE=1

# Hold the UFS controller at its top gear and raise queue depth/readahead.
# Raw direct reads: 1079 -> 1335 MiB/s.
UFS_TUNE=1
UFS_MIN_FREQ=200000000
UFS_SCHEDULER=none
UFS_NR_REQUESTS=32
UFS_READ_AHEAD_KB=512