name: build

# Builds the two artifacts this project produces - a boot image and a Debian
# root filesystem image - and publishes them to a release when a tag is pushed.
#
# Neither artifact contains proprietary Qualcomm firmware. Those blobs cannot be
# redistributed, so they are extracted from a stock ROM you own with
# scripts/prepare-firmware.sh after flashing.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      kernel_ref:
        description: 'Kernel tag or commit to build against'
        required: false
        default: 'v7.1-rc1'

env:
  KERNEL_REPO: https://github.com/torvalds/linux.git
  KERNEL_REF: ${{ github.event.inputs.kernel_ref || 'v7.1-rc1' }}
  DTS_NAME: sdm845-xiaomi-equuleus
  # The boot partition on this device.
  BOOT_PART_SIZE: 67108864
  # Final stock fastboot ROM for this EOL device. Verified reachable.
  ROM_VERSION: V12.5.2.0.QECCNXM
  ROM_FILE: equuleus_images_V12.5.2.0.QECCNXM_20211118.0000.00_10.0_cn_4ce136c735.tgz

jobs:
  boot:
    name: boot.img
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Check script permissions
        run: scripts/check-modes.sh

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            cpio gzip python3 mkbootimg android-sdk-libsparse-utils

      - name: Ensure a working mkbootimg
        run: |
          # Ubuntu ships mkbootimg with a top-level "from gki... import" but no
          # gki module, so it dies before doing anything. Debian's build of the
          # same tool does not, and the package is pure Python (arch all), so
          # install that one instead of writing our own packer.
          if mkbootimg 2>&1 | grep -q "No module named 'gki'"; then
            echo "  Ubuntu mkbootimg is broken, installing Debian's"
            curl -fsSL --retry 3 --max-time 300 \
              http://deb.debian.org/debian/dists/trixie/main/binary-all/Packages.gz \
              -o /tmp/Packages-all.gz
            FN=$(gzip -dc /tmp/Packages-all.gz \
              | awk '/^Package: mkbootimg$/{f=1} f&&/^Filename:/{print $2; exit}' || true)
            echo "  package: $FN"
            curl -fsSL --retry 3 --max-time 300 -o /tmp/mkbootimg.deb \
              "http://deb.debian.org/debian/$FN"
            sudo dpkg -i /tmp/mkbootimg.deb
          fi
          mkbootimg 2>&1 | head -2 || true

      - name: Fetch kernel source
        run: |
          # Shallow clone of just the tag we target; the tree is large and we
          # only ever need one revision.
          git init --quiet kernel
          cd kernel
          git remote add origin "$KERNEL_REPO"
          git fetch --depth 1 origin "$KERNEL_REF"
          git checkout --quiet FETCH_HEAD
          make -s kernelversion | sed 's/^/  kernel: /'

      - name: Install device tree and kernel sources vanilla lacks
        run: |
          # The device was brought up against postmarketOS's patched 7.1-rc1,
          # so a handful of files it depends on do not exist in stock mainline.
          # kernel/tree-delta/ holds exactly those, and this script overlays
          # them and wires the added drivers into Kconfig/Makefile.
          KERNEL_SRC="$PWD/kernel" scripts/apply-tree-delta.sh

          DTS_DIR=kernel/arch/arm64/boot/dts/qcom
          cp "dts/$DTS_NAME.dts" "$DTS_DIR/"
          grep -q "$DTS_NAME.dtb" "$DTS_DIR/Makefile" \
            || printf 'dtb-$(CONFIG_ARCH_QCOM)\t+= %s.dtb\n' "$DTS_NAME" >> "$DTS_DIR/Makefile"

          # The panel driver is a plain source file plus two one-line build
          # hooks, so nothing here depends on patch context that varies between
          # kernel trees.
          PANEL_DIR=kernel/drivers/gpu/drm/panel
          cp kernel/panel-samsung-ea8074.c "$PANEL_DIR/"
          if ! grep -q DRM_PANEL_SAMSUNG_EA8074 "$PANEL_DIR/Kconfig"; then
            cat >> "$PANEL_DIR/Kconfig" <<'EOF'

          config DRM_PANEL_SAMSUNG_EA8074
          	tristate "Samsung EA8074 DSI cmd mode panel"
          	depends on OF
          	depends on DRM_MIPI_DSI
          	depends on BACKLIGHT_CLASS_DEVICE
          	help
          	  Say Y here to enable the Samsung EA8074 AMOLED command mode panel
          	  (1080x2248@60Hz) found in the Xiaomi Mi 8 and Mi 8 Pro.
          EOF
          fi
          grep -q panel-samsung-ea8074 "$PANEL_DIR/Makefile" \
            || printf 'obj-$(CONFIG_DRM_PANEL_SAMSUNG_EA8074) += panel-samsung-ea8074.o\n' >> "$PANEL_DIR/Makefile"

      - name: Configure
        run: |
          cp config/equuleus.config kernel/.config
          make -C kernel ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig

      - name: Build kernel and device tree
        run: |
          make -C kernel ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
               KALLSYMS_EXTRA_PASS=1 -j"$(nproc)" \
               Image.gz "qcom/$DTS_NAME.dtb"

      - name: Verify device tree nodes
        run: |
          # Confirm the nodes this board depends on are enabled in the compiled
          # DTB. The audio bring-up failed for weeks because gpi_dma0 was
          # disabled in the reference tree, which is exactly what this catches.
          DTB=$(find kernel/arch/arm64/boot/dts/qcom -name "$DTS_NAME.dtb" | head -1)
          DTB="$DTB" scripts/check-dtb-nodes.sh

      - name: Fetch GPU firmware from the stock ROM
        run: |
          # msm is built in and loads this during probe, before the root
          # filesystem exists, so it has to be inside the initramfs.
          mkdir -p rom gpu-fw
          curl -fL --retry 3 --max-time 1800 -o rom/stock.tgz \
            "https://cdnorg.d.miui.com/$ROM_VERSION/$ROM_FILE"
          tar -xzf rom/stock.tgz -C rom --wildcards '*/images/vendor.img'
          find rom -name 'vendor.img' | while read -r f; do mv -f "$f" rom/images/ 2>/dev/null || { mkdir -p rom/images; mv -f "$f" rom/images/; }; done
          # vendor.img is an Android sparse image, so it cannot be loop-mounted
          # as-is: mount reports "wrong fs type, bad option, bad superblock".
          simg2img rom/images/vendor.img rom/vendor-raw.img
          sudo mkdir -p /mnt/vendor
          sudo mount -o loop,ro rom/vendor-raw.img /mnt/vendor
          sudo cp /mnt/vendor/firmware/a630_gmu.bin gpu-fw/ 2>/dev/null || true
          sudo cp /mnt/vendor/firmware/a630_zap.elf gpu-fw/a630_zap.mbn 2>/dev/null || true
          sudo cp /mnt/vendor/firmware/a630_zap.elf gpu-fw/a630_zap.mdt 2>/dev/null || true
          sudo cp /mnt/vendor/firmware/tas2557_uCDSP.bin gpu-fw/ 2>/dev/null || true
          sudo umount /mnt/vendor

          # The Bluetooth patch and NVM live in their own partition, not in
          # vendor.img. The controller downloads them from the host at 0.75 s,
          # before the root filesystem exists, so they belong in the initramfs.
          tar -xzf rom/stock.tgz -C rom --wildcards '*/images/bluetooth.img'
          find rom -name 'bluetooth.img' | while read -r f; do mv -f "$f" rom/images/ 2>/dev/null || true; done
          if [ -f rom/images/bluetooth.img ]; then
            sudo mkdir -p /mnt/bt
            sudo mount -o loop,ro rom/images/bluetooth.img /mnt/bt
            sudo mkdir -p gpu-fw/qca
            for f in crbtfw21.tlv crnv21.bin crbtfw20.tlv crnv20.bin; do
              sudo cp "/mnt/bt/image/$f" gpu-fw/qca/ 2>/dev/null || true
            done
            sudo umount /mnt/bt
            ls -l gpu-fw/qca/ || true
          else
            echo "bluetooth.img not found in the ROM archive" >&2
            exit 1
          fi
          # The SQE blob from the 2021 stock ROM reports version 0x187 and
          # mainline requires 0x190, so take the current one from linux-firmware
          # instead. See docs/gpu-firmware.md.
          curl -fsSL --retry 3 --max-time 300 -o gpu-fw/a630_sqe.fw \
            https://gitlab.com/kernel-firmware/linux-firmware/-/raw/main/qcom/a630_sqe.fw
          ls -l gpu-fw/
          python3 - <<'PY'
          import struct
          d = open('gpu-fw/a630_sqe.fw','rb').read()
          buf0 = struct.unpack('<I', d[4:8])[0]
          ver = buf0 & 0xfff
          print(f'  SQE ucode version {ver:#x} (need >= 0x190)')
          if ver < 0x190:
              raise SystemExit('SQE firmware too old, the GPU will not come up')
          PY

      - name: Build initramfs
        run: |
          # A static aarch64 busybox comes out of the Debian arm64 package.
          curl -s --max-time 180 \
            http://deb.debian.org/debian/dists/trixie/main/binary-arm64/Packages.gz \
            -o /tmp/Packages.gz
          FN=$(gzip -dc /tmp/Packages.gz \
               | awk '/^Package: busybox-static$/{f=1} f&&/^Filename:/{print $2; exit}')
          curl -s --max-time 300 -o /tmp/busybox.deb "http://deb.debian.org/debian/$FN"
          mkdir -p /tmp/bb && dpkg-deb -x /tmp/busybox.deb /tmp/bb
          GPU_FW_DIR="$PWD/gpu-fw" BUSYBOX=/tmp/bb/usr/bin/busybox scripts/build-initramfs.sh

      - name: Pack boot image
        run: |
          # The bootloader requires the DTB to start exactly where the gzip
          # stream ends; pack-bootimg.sh refuses to continue otherwise.
          KERNEL_SRC=kernel OUT="$PWD/out" INITRD="$PWD/out/initramfs.cpio.gz" \
            scripts/pack-bootimg.sh \
              "kernel/arch/arm64/boot/Image.gz" \
              "kernel/arch/arm64/boot/dts/qcom/$DTS_NAME.dtb"
          python3 scripts/verify-image.py out/boot.img

      - name: Verify the packed image carries every firmware blob
        run: |
          # The initramfs must contain everything that loads before the root
          # filesystem exists. This has been wrong before: the Bluetooth patch
          # lives in its own ROM partition, so a build that only read vendor.img
          # shipped without it and the controller could not start.
          IMAGE=out/boot.img
          python3 - "$IMAGE" <<'PY'
          import gzip, io, os, struct, subprocess, sys, tempfile

          data = open(sys.argv[1], 'rb').read()
          page = struct.unpack_from('<I', data, 36)[0]
          kernel_size = struct.unpack_from('<I', data, 8)[0]
          ramdisk_size = struct.unpack_from('<I', data, 16)[0]
          off = page + (kernel_size + page - 1) // page * page
          ramdisk = data[off:off + ramdisk_size]

          with tempfile.NamedTemporaryFile(suffix='.cpio.gz', delete=False) as f:
              f.write(ramdisk)
              path = f.name

          listing = subprocess.run(['cpio', '-t'], input=gzip.decompress(open(path,'rb').read()),
                                   capture_output=True).stdout.decode()
          os.unlink(path)

          required = [
              'lib/firmware/qcom/a630_sqe.fw',
              'lib/firmware/qcom/a630_gmu.bin',
              'lib/firmware/qcom/a630_zap.mdt',
              'lib/firmware/tas2557_uCDSP.bin',
              'lib/firmware/qca/crbtfw21.tlv',
              'lib/firmware/qca/crnv21.bin',
          ]
          missing = [r for r in required if r not in listing]
          for r in required:
              print(('  [OK]   ' if r not in missing else '  [MISS] ') + r)
          if missing:
              sys.exit(f'{len(missing)} firmware file(s) missing from the initramfs')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: boot
          path: out/boot.img

  rootfs:
    name: rootfs.ext4
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install rootfs tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mmdebstrap arch-test qemu-user-static android-sdk-libsparse-utils \
            e2fsprogs util-linux dpkg-dev curl

      - name: Use Debian trixie archive keys
        run: |
          # The runner is Ubuntu, whose debian-archive-keyring predates trixie,
          # so mmdebstrap rejects the Release file as unsigned. Install the
          # matching keyring from the suite we are actually bootstrapping.
          curl -s --max-time 150 \
            http://deb.debian.org/debian/dists/trixie/main/binary-all/Packages.gz \
            -o /tmp/Packages-all.gz
          FN=$(gzip -dc /tmp/Packages-all.gz \
            | awk '/^Package: debian-archive-keyring$/{f=1} f&&/^Filename:/{print $2; exit}')
          echo "  keyring package: $FN"
          curl -s --max-time 300 -o /tmp/keyring.deb "http://deb.debian.org/debian/$FN"
          sudo dpkg -i /tmp/keyring.deb

      - name: Build rootfs
        run: |
          # Cross-architecture debootstrap plus the systemd setup. Proprietary
          # firmware is deliberately not included; see scripts/prepare-firmware.sh.
          sudo ROOT="$PWD/out-rootfs" OUT="$PWD/out" scripts/build-rootfs.sh

      - name: Install firmware daemons and WiFi tools
        run: |
          # rmtfs, pd-mapper, tqftpserv 1.3 (from sid) and the libnl runtime iw
          # needs. Without these there is no WiFi even with perfect firmware.
          sudo ROOT="$PWD/out-rootfs" scripts/install-firmware-daemons.sh

      - name: Prepare ROM directory
        run: mkdir -p rom

      - uses: actions/cache@v4
        id: rom-cache
        with:
          path: rom/images
          key: stock-rom-${{ env.ROM_VERSION }}

      - name: Extract firmware from the stock ROM
        if: steps.rom-cache.outputs.cache-hit != 'true'
        run: |
          # Official Xiaomi CDN. Verified reachable: 3051 MB,
          # application/x-gtar-compressed. Mirrors exist at bn./cdnorg./bigota.
          curl -fL --retry 3 --max-time 1800 -o rom/stock.tgz \
            "https://cdnorg.d.miui.com/$ROM_VERSION/$ROM_FILE"
          mkdir -p rom/images
          # modem.img holds WiFi/BT/ADSP firmware, vendor.img holds the signed
          # zap shader and the speaker amp firmware.
          # The archive nests everything under a directory named after the ROM,
          # so match the two files by pattern instead of assuming a prefix.
          tar -xzf rom/stock.tgz -C rom --wildcards \
              '*/images/modem.img' '*/images/vendor.img' '*/images/bluetooth.img' || \
            tar -tzf rom/stock.tgz | head -20
          mkdir -p rom/images
          # Parenthesise the -o chain: without it find's implicit -a binds tighter
          # than -o and only the first name is matched.
          find rom \( -name 'modem.img' -o -name 'vendor.img' -o -name 'bluetooth.img' \) \
            -type f | while read -r f; do
                echo "  found $f"
                mv -f "$f" rom/images/
              done
          ls -l rom/images/

      - name: Install proprietary firmware into the rootfs
        run: |
          # Cannot be redistributed with the source, but it is reproducible: it
          # comes from Xiaomi's own server, which is why the build does this.
          # Run as root: the script uses "sudo -n", which works on a developer
          # machine with cached credentials but fails on a fresh runner because
          # there is no timestamp to reuse.
          sudo ROM_DIR="$PWD/rom/images" ROOT="$PWD/out-rootfs" \
            scripts/prepare-firmware.sh

      - name: Build the image
        run: |
          sudo ROOT="$PWD/out-rootfs" OUT="$PWD/out" scripts/make-rootfs-image.sh
          ls -lh out/rootfs.ext4

      - uses: actions/upload-artifact@v4
        with:
          name: rootfs
          path: out/rootfs.ext4

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [boot, rootfs]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Compress the rootfs image
        run: |
          # GitHub rejects release assets of 2 GiB or more, and the raw ext4
          # image is 4 GiB even though only about 240 MB of it is used. gzip
          # brings it to roughly 585 MiB, about 7:1.
          ls -lh dist/rootfs/
          gzip -9 -k dist/rootfs/rootfs.ext4
          ls -lh dist/rootfs/rootfs.ext4.gz
          # Keep the uncompressed file out of the release.
          rm -f dist/rootfs/rootfs.ext4
      - name: Note about firmware
        run: |
          cat > dist/FIRMWARE.txt <<'EOF'
          This rootfs includes proprietary Qualcomm firmware extracted from the
          stock fastboot ROM for this device:

              V12.5.2.0.QECCNXM / cdnorg.d.miui.com

          It is fetched from Xiaomi's own CDN during the build rather than stored
          in this repository. The device is end-of-life, so that image is final.

          boot.img also carries the firmware that has to be present before the
          root filesystem is mounted: the GPU blobs (a630_sqe.fw from
          linux-firmware, plus a630_gmu.bin and a630_zap.mdt from the stock ROM),
          the speaker amplifier's tas2557_uCDSP.bin, and the Bluetooth patch and
          NVM under qca/. Without those, msm, tas2557 and the QCA controller all
          probe before the root filesystem exists and fail to load anything.

          To refresh the firmware by hand:

              ROM_DIR=/path/to/stock-rom ROOT=out-rootfs scripts/prepare-firmware.sh
          EOF
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/boot/boot.img
            dist/rootfs/rootfs.ext4.gz
            dist/FIRMWARE.txt
          body: |
            Build of `${{ github.sha }}` against kernel `${{ env.KERNEL_REF }}`.

            | Artifact | Flash as |
            |---|---|
            | `boot.img` | `fastboot flash boot boot.img` |
            | `rootfs.ext4.gz` | `gunzip rootfs.ext4.gz`, then `fastboot flash userdata rootfs.ext4` |

            The rootfs ships gzipped because the raw image is 4 GiB and GitHub
            caps release assets at 2 GiB. It compresses about 7:1, to roughly
            585 MiB.

            Neither file contains proprietary firmware. See `FIRMWARE.txt`.
