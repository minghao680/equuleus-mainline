name: build

# Builds the two artifacts this project produces - a boot image and a Debian
# root filesystem image - and publishes them to a release when a tag is pushed.
#
# Neither artifact contains proprietary Qualcomm firmware. Those blobs cannot be
# redistributed, so they are extracted from a stock ROM you own with
# scripts/prepare-firmware.sh after flashing.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      kernel_ref:
        description: 'Kernel tag or commit to build against'
        required: false
        default: 'v7.1-rc1'

env:
  KERNEL_REPO: https://github.com/torvalds/linux.git
  KERNEL_REF: ${{ github.event.inputs.kernel_ref || 'v7.1-rc1' }}
  DTS_NAME: sdm845-xiaomi-equuleus
  # The boot partition on this device.
  BOOT_PART_SIZE: 67108864
  # Final stock fastboot ROM for this EOL device. Verified reachable.
  ROM_VERSION: V12.5.2.0.QECCNXM
  ROM_FILE: equuleus_images_V12.5.2.0.QECCNXM_20211118.0000.00_10.0_cn_4ce136c735.tgz

jobs:
  boot:
    name: boot.img
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            cpio gzip python3 mkbootimg

      - name: Ensure a working mkbootimg
        run: |
          # Ubuntu ships mkbootimg with a top-level "from gki... import" but no
          # gki module, so it dies before doing anything. Debian's build of the
          # same tool does not, and the package is pure Python (arch all), so
          # install that one instead of writing our own packer.
          if mkbootimg 2>&1 | grep -q "No module named 'gki'"; then
            echo "  Ubuntu mkbootimg is broken, installing Debian's"
            curl -fsSL --retry 3 --max-time 300 \
              http://deb.debian.org/debian/dists/trixie/main/binary-all/Packages.gz \
              -o /tmp/Packages-all.gz
            FN=$(gzip -dc /tmp/Packages-all.gz \
              | awk '/^Package: mkbootimg$/{f=1} f&&/^Filename:/{print $2; exit}' || true)
            echo "  package: $FN"
            curl -fsSL --retry 3 --max-time 300 -o /tmp/mkbootimg.deb \
              "http://deb.debian.org/debian/$FN"
            sudo dpkg -i /tmp/mkbootimg.deb
          fi
          mkbootimg 2>&1 | head -2 || true

      - name: Fetch kernel source
        run: |
          # Shallow clone of just the tag we target; the tree is large and we
          # only ever need one revision.
          git init --quiet kernel
          cd kernel
          git remote add origin "$KERNEL_REPO"
          git fetch --depth 1 origin "$KERNEL_REF"
          git checkout --quiet FETCH_HEAD
          make -s kernelversion | sed 's/^/  kernel: /'

      - name: Install device tree and panel driver
        run: |
          DTS_DIR=kernel/arch/arm64/boot/dts/qcom
          cp "dts/$DTS_NAME.dts" "$DTS_DIR/"
          grep -q "$DTS_NAME.dtb" "$DTS_DIR/Makefile" \
            || printf 'dtb-$(CONFIG_ARCH_QCOM)\t+= %s.dtb\n' "$DTS_NAME" >> "$DTS_DIR/Makefile"
          # The panel driver is a plain source file plus two one-line build
          # hooks, so nothing here depends on patch context that varies between
          # kernel trees. build.sh does the same thing locally.
          PANEL_DIR=kernel/drivers/gpu/drm/panel
          cp kernel/panel-samsung-ea8074.c "$PANEL_DIR/"
          if ! grep -q DRM_PANEL_SAMSUNG_EA8074 "$PANEL_DIR/Kconfig"; then
            cat >> "$PANEL_DIR/Kconfig" <<'EOF'

          config DRM_PANEL_SAMSUNG_EA8074
          	tristate "Samsung EA8074 DSI cmd mode panel"
          	depends on OF
          	depends on DRM_MIPI_DSI
          	depends on BACKLIGHT_CLASS_DEVICE
          	help
          	  Say Y here to enable the Samsung EA8074 AMOLED command mode panel
          	  (1080x2248@60Hz) found in the Xiaomi Mi 8 and Mi 8 Pro.
          EOF
          fi
          grep -q panel-samsung-ea8074 "$PANEL_DIR/Makefile" \
            || printf 'obj-$(CONFIG_DRM_PANEL_SAMSUNG_EA8074) += panel-samsung-ea8074.o\n' >> "$PANEL_DIR/Makefile"

      - name: Configure
        run: |
          cp config/equuleus.config kernel/.config
          make -C kernel ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig

      - name: Build kernel and device tree
        run: |
          make -C kernel ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
               KALLSYMS_EXTRA_PASS=1 -j"$(nproc)" \
               Image.gz "qcom/$DTS_NAME.dtb"

      - name: Build initramfs
        run: |
          # A static aarch64 busybox comes out of the Debian arm64 package.
          curl -s --max-time 180 \
            http://deb.debian.org/debian/dists/trixie/main/binary-arm64/Packages.gz \
            -o /tmp/Packages.gz
          FN=$(gzip -dc /tmp/Packages.gz \
               | awk '/^Package: busybox-static$/{f=1} f&&/^Filename:/{print $2; exit}')
          curl -s --max-time 300 -o /tmp/busybox.deb "http://deb.debian.org/debian/$FN"
          mkdir -p /tmp/bb && dpkg-deb -x /tmp/busybox.deb /tmp/bb
          BUSYBOX=/tmp/bb/usr/bin/busybox scripts/build-initramfs.sh

      - name: Pack boot image
        run: |
          # The bootloader requires the DTB to start exactly where the gzip
          # stream ends; pack-bootimg.sh refuses to continue otherwise.
          KERNEL_SRC=kernel OUT="$PWD/out" INITRD="$PWD/out/initramfs.cpio.gz" \
            scripts/pack-bootimg.sh \
              "kernel/arch/arm64/boot/Image.gz" \
              "kernel/arch/arm64/boot/dts/qcom/$DTS_NAME.dtb"
          python3 scripts/verify-image.py out/boot.img

      - uses: actions/upload-artifact@v4
        with:
          name: boot
          path: out/boot.img

  rootfs:
    name: rootfs.ext4
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install rootfs tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mmdebstrap arch-test qemu-user-static \
            e2fsprogs util-linux dpkg-dev curl

      - name: Use Debian trixie archive keys
        run: |
          # The runner is Ubuntu, whose debian-archive-keyring predates trixie,
          # so mmdebstrap rejects the Release file as unsigned. Install the
          # matching keyring from the suite we are actually bootstrapping.
          curl -s --max-time 150 \
            http://deb.debian.org/debian/dists/trixie/main/binary-all/Packages.gz \
            -o /tmp/Packages-all.gz
          FN=$(gzip -dc /tmp/Packages-all.gz \
            | awk '/^Package: debian-archive-keyring$/{f=1} f&&/^Filename:/{print $2; exit}')
          echo "  keyring package: $FN"
          curl -s --max-time 300 -o /tmp/keyring.deb "http://deb.debian.org/debian/$FN"
          sudo dpkg -i /tmp/keyring.deb

      - name: Build rootfs
        run: |
          # Cross-architecture debootstrap plus the systemd setup. Proprietary
          # firmware is deliberately not included; see scripts/prepare-firmware.sh.
          ROOT="$PWD/out-rootfs" OUT="$PWD/out" scripts/build-rootfs.sh

      - name: Install firmware daemons and WiFi tools
        run: |
          # rmtfs, pd-mapper, tqftpserv 1.3 (from sid) and the libnl runtime iw
          # needs. Without these there is no WiFi even with perfect firmware.
          ROOT="$PWD/out-rootfs" scripts/install-firmware-daemons.sh

      - name: Prepare ROM directory
        run: mkdir -p rom

      - uses: actions/cache@v4
        id: rom-cache
        with:
          path: rom/images
          key: stock-rom-${{ env.ROM_VERSION }}

      - name: Extract firmware from the stock ROM
        if: steps.rom-cache.outputs.cache-hit != 'true'
        run: |
          # Official Xiaomi CDN. Verified reachable: 3051 MB,
          # application/x-gtar-compressed. Mirrors exist at bn./cdnorg./bigota.
          curl -fL --retry 3 --max-time 1800 -o rom/stock.tgz \
            "https://cdnorg.d.miui.com/$ROM_VERSION/$ROM_FILE"
          mkdir -p rom/images
          # modem.img holds WiFi/BT/ADSP firmware, vendor.img holds the signed
          # zap shader and the speaker amp firmware.
          tar -xzf rom/stock.tgz -C rom/images --strip-components=1 \
              images/modem.img images/vendor.img

      - name: Install proprietary firmware into the rootfs
        run: |
          # Cannot be redistributed with the source, but it is reproducible: it
          # comes from Xiaomi's own server, which is why the build does this.
          ROM_DIR="$PWD/rom/images" ROOT="$PWD/out-rootfs" scripts/prepare-firmware.sh

      - name: Build the image
        run: |
          ROOT="$PWD/out-rootfs" OUT="$PWD/out" scripts/make-rootfs-image.sh
          ls -lh out/rootfs.ext4

      - uses: actions/upload-artifact@v4
        with:
          name: rootfs
          path: out/rootfs.ext4

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [boot, rootfs]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Note about firmware
        run: |
          cat > dist/FIRMWARE.txt <<'EOF'
          This rootfs includes proprietary Qualcomm firmware extracted from the
          stock fastboot ROM for this device:

              V12.5.2.0.QECCNXM / cdnorg.d.miui.com

          It is fetched from Xiaomi's own CDN during the build rather than stored
          in this repository. The device is end-of-life, so that image is final.

          boot.img contains no proprietary firmware. The GPU's a630_sqe.fw is
          therefore missing at boot because msm loads it before the root
          filesystem is mounted; the display still works, GPU acceleration does
          not. Build the boot image locally with the firmware present, or add it
          to the initramfs, if you need the GPU.

          To refresh the firmware by hand:

              ROM_DIR=/path/to/stock-rom ROOT=out-rootfs scripts/prepare-firmware.sh
          EOF
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/boot/boot.img
            dist/rootfs/rootfs.ext4
            dist/FIRMWARE.txt
          body: |
            Build of `${{ github.sha }}` against kernel `${{ env.KERNEL_REF }}`.

            | Artifact | Flash as |
            |---|---|
            | `boot.img` | `fastboot flash boot boot.img` |
            | `rootfs.ext4` | `fastboot flash userdata rootfs.ext4` |

            Neither file contains proprietary firmware. See `FIRMWARE.txt`.
